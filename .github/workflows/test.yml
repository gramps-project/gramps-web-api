name: unit tests

on:
  push:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install Ubuntu dependencies
        run: sudo apt update && sudo apt-get -y install gettext appstream pkg-config libcairo2-dev gir1.2-gtk-3.0 libgirepository1.0-dev libicu-dev libopencv-dev gir1.2-pango-1.0
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          # CPU-only build: the default one pulls in ~3 GB of CUDA libraries
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install opencv-python
          pip install -r requirements-dev.txt
          pip install .[ai]
      - name: Run type checker
        run: mypy --install-types --non-interactive --ignore-missing-imports --exclude build .

  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache Hugging Face models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            hf-models-
      - name: Install Ubuntu dependencies
        run: sudo apt update && sudo apt-get -y install gettext appstream pkg-config libcairo2-dev gir1.2-gtk-3.0 libgirepository1.0-dev libicu-dev libopencv-dev tesseract-ocr gir1.2-pango-1.0 poppler-utils
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          # CPU-only build: the default one pulls in ~3 GB of CUDA libraries
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install opencv-python
          pip install -r requirements-dev.txt
          pip install .[ai]
          pip list
      - name: Pre-download Hugging Face model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/paraphrase-albert-small-v2')"
      - name: Clean up package caches
        run: |
          sudo apt-get clean
          pip cache purge
          df -h
      - name: Check for single alembic head
        run: |
          HEAD_COUNT=$(alembic heads | wc -l)
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "ERROR: Multiple alembic heads detected! Run 'alembic heads' to inspect."
            alembic heads
            exit 1
          fi
      - name: Test with pytest
        env:
          HF_HUB_OFFLINE: 1
        run: pytest -x

  test-base-image:
    runs-on: ubuntu-26.04
    container: ghcr.io/gramps-project/gramps-web-base:latest
    services:
      # used by tests/test_shared_postgresql.py
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gramps
          POSTGRES_PASSWORD: gramps
          POSTGRES_DB: gramps
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Cache Hugging Face models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-models-base-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            hf-models-base-
      - name: Install package
        run: pip install --no-cache-dir -r requirements-dev.txt && pip install --no-cache-dir .[ai]
      - name: Pre-download Hugging Face model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/paraphrase-albert-small-v2')"
      - name: Test with pytest
        env:
          HF_HUB_OFFLINE: 1
          GRAMPSWEB_TEST_POSTGRES_URL: postgresql://gramps:gramps@postgres:5432/gramps
        # the base image ships the SharedPostgreSQL addon
        run: GRAMPSWEB_TEST_ADDONS_DIR=/root/gramps/gramps$GRAMPS_VERSION/plugins pytest -x
